name: Check and publish execmap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to GitHub Pages after checks pass'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: execmap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site_base: ['/execmap', '']
    env:
      SITE_BASEURL: ${{ matrix.site_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Hosted Ubuntu already provides Chromium's runtime libraries;
      # the site serves its own fonts, so no extra OS font packages are needed.
      - run: npx playwright install --only-shell chromium
      - run: npm run test:browser
      - name: Browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ strategy.job-index }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: matrix.site_base == '/execmap'
        with:
          path: _site
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy)
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
